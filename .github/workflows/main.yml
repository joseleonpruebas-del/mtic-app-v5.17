name: Generar APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Plugin nativo de camara (lista y abre apps de camara instaladas)
        run: |
          D=android/app/src/main/java/co/mtic/f27
          mkdir -p $D
          cp native/*.java $D/
      - name: Lector de codigos (ZXing) y version minima de Android
        run: |
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 24/' android/variables.gradle
          sed -i "s#^dependencies {#dependencies {\n    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'\n    implementation 'com.google.zxing:core:3.5.3'#" android/app/build.gradle
          sed -i 's#</application>#<activity android:name="co.mtic.f27.CaptureActivityPortrait" android:screenOrientation="portrait" android:stateNotNeeded="true" android:theme="@style/zxing_CaptureTheme" android:windowSoftInputMode="stateAlwaysHidden"/></application>#' android/app/src/main/AndroidManifest.xml
      - name: Camara GPS nativa (CameraX, ubicacion y EXIF)
        run: |
          sed -i "s#^dependencies {#dependencies {\n    implementation 'androidx.camera:camera-core:1.3.4'\n    implementation 'androidx.camera:camera-camera2:1.3.4'\n    implementation 'androidx.camera:camera-lifecycle:1.3.4'\n    implementation 'androidx.camera:camera-view:1.3.4'\n    implementation 'com.google.android.gms:play-services-location:21.3.0'\n    implementation 'androidx.exifinterface:exifinterface:1.3.7'#" android/app/build.gradle
          sed -i 's#</application>#<activity android:name="co.mtic.f27.CaptureGpsActivity" android:exported="false" android:screenOrientation="portrait" android:theme="@style/Theme.AppCompat.NoActionBar"/></application>#' android/app/src/main/AndroidManifest.xml
      - name: Permisos de camara y GPS
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA"/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/><uses-feature android:name="android.hardware.camera" android:required="false"/><queries><intent><action android:name="android.media.action.IMAGE_CAPTURE"/></intent></queries><application#' $M
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mtic-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
